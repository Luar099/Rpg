<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MYR — RPG Hub</title>
  <style>
    :root{
      --bg:#05060a;
      --card:rgba(16,18,26,.92);
      --muted:#a0a6b8;
      --txt:#f2f4ff;
      --line:rgba(255,255,255,.08);

      --btn:#7c3aed;      /* roxo */
      --btn2:#22c55e;     /* verde */
      --bad:#ef4444;
      --ok:#22c55e;
      --gold:#f59e0b;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    body{margin:0;background:
      radial-gradient(1200px 700px at 10% -10%, rgba(124,58,237,.22), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(34,197,94,.16), transparent 55%),
      linear-gradient(180deg,#05060a,#0a0b12 55%,#070712);
      color:var(--txt)
    }
    header{
      padding:18px 16px;border-bottom:1px solid var(--line);
      position:sticky;top:0;background:rgba(5,6,10,.72);backdrop-filter: blur(10px);z-index:5
    }
    h1{margin:0;font-size:18px;letter-spacing:.3px}
    main{max-width:1220px;margin:0 auto;padding:16px;display:grid;gap:16px}
    .grid{display:grid;gap:16px}
    @media (min-width:980px){ .grid{grid-template-columns:1.15fr .85fr} }
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter: blur(10px)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    label{font-size:12px;color:var(--muted)}
    input,select,button,textarea{
      border-radius:14px;border:1px solid var(--line);background:rgba(6,8,14,.88);color:var(--txt);
      padding:10px 12px;outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:rgba(124,58,237,.75)}
    button{cursor:pointer;background:var(--btn);border:none;font-weight:900}
    button.secondary{background:rgba(9,10,18,.25);border:1px solid var(--line)}
    button.danger{background:var(--bad)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .muted{color:var(--muted);font-size:13px;line-height:1.35}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(6,8,14,.75);
      font-size:12px;color:var(--muted)
    }
    .divider{height:1px;background:var(--line);margin:12px 0}
    .hidden{display:none!important}
    .mini{font-size:12px}
    .ok{color:var(--ok);font-weight:900}
    .bad{color:var(--bad);font-weight:900}

    /* Tabs */
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tabBtn{
      background:rgba(6,8,14,.75);border:1px solid var(--line);
      padding:10px 12px;border-radius:999px;font-weight:900;color:var(--muted)
    }
    .tabBtn.active{background:var(--btn);color:#fff;border-color:transparent}

    /* Overlay / Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);padding:18px;overflow:auto;z-index:60}
    .modal{
      max-width:1120px;margin:18px auto;border:1px solid var(--line);
      border-radius:18px;background:rgba(10,12,18,.92);backdrop-filter: blur(10px);
      padding:16px
    }
    .modalHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .warn{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);padding:12px;border-radius:14px}
    .good{border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.08);padding:12px;border-radius:14px}

    /* Selection cards */
    .selectGrid{display:grid;gap:10px}
    @media (min-width:900px){ .selectGrid{grid-template-columns:1fr 1fr} }
    .selectCard{
      border:1px solid var(--line);background:rgba(6,8,14,.65);padding:12px;border-radius:18px;
      display:flex;gap:12px;align-items:flex-start;justify-content:space-between
    }
    .selectCard .left{min-width:0}
    .selectCard b{display:block;font-size:14px}
    .tag{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
      background:rgba(6,8,14,.65);color:var(--muted);font-size:12px}
    .selectedGlow{outline:2px solid rgba(124,58,237,.65); box-shadow: 0 0 0 6px rgba(124,58,237,.12);}

    /* Avatar */
    .avatarBox{width:150px;height:150px;border-radius:18px;border:1px dashed var(--line);
      background:rgba(6,8,14,.65);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .avatarBox img{width:100%;height:100%;object-fit:cover}

    /* Meters */
    .meterRow{display:grid;grid-template-columns:1fr 170px 150px;gap:10px;align-items:center}
    @media (max-width:640px){ .meterRow{grid-template-columns:1fr 1fr} .meterRow .ctrl{grid-column:1/-1;justify-content:flex-end} }
    .bar{height:12px;border-radius:999px;background:rgba(6,8,14,.65);border:1px solid var(--line);overflow:hidden}
    .bar > div{height:100%;background:var(--btn);width:0%}
    .ctrl{display:flex;gap:8px;align-items:center}
    .ctrl .num{min-width:28px;text-align:center;font-weight:900}

    /* Player bars */
    .kpiGrid{display:grid;gap:10px}
    @media (min-width:720px){ .kpiGrid{grid-template-columns:1fr 1fr} }
    .kpiBox{border:1px solid var(--line);background:rgba(6,8,14,.65);border-radius:16px;padding:12px}
    .kpiTitle{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .kpiTitle b{font-size:13px}
    .kpiValue{font-size:18px;font-weight:950}
    .kpiBar{height:12px;border-radius:999px;background:rgba(6,8,14,.35);border:1px solid var(--line);overflow:hidden;margin-top:8px}
    .kpiBar > div{height:100%;width:0%;background:var(--btn)}
    .xpFill{background:var(--gold)!important}

    /* Wheel */
    .wheelWrap{display:grid;gap:14px;justify-items:center}
    canvas{border:1px solid var(--line);border-radius:18px;background:rgba(6,8,14,.65);max-width:100%}
    .pointer{
      width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
      border-bottom:20px solid var(--btn);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
      margin-top:-8px;
    }

    /* Wheel legend */
    .wheelLegend{width:100%;max-width:900px;display:grid;gap:8px}
    .legendList{border:1px solid var(--line);border-radius:14px;background:rgba(6,8,14,.65);padding:10px;max-height:180px;overflow:auto}
    .legendItem{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:4px 0;flex-wrap:wrap}
    .legendBadge{min-width:34px;text-align:center;padding:2px 6px;border-radius:999px;border:1px solid var(--line);font-weight:900;color:#fff;background:rgba(124,58,237,.35)}
    @media (max-width:640px){ .legendList{max-height:220px} }

    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
    th{color:var(--muted);font-weight:900}
    .right{text-align:right}
  </style>
</head>
<body>
<header class="row" style="justify-content:space-between">
  <div class="row">
    <h1>🜁 MYR</h1>
    <span class="pill" id="sessionPill">Sessão: não logado</span>
  </div>
  <div class="row">
    <button class="secondary" id="btnReset">Resetar dados</button>
    <button class="secondary hidden" id="btnLogout">Sair</button>
  </div>
</header>

<main>
  <!-- LOGIN -->
  <section class="card" id="loginCard">
    <h2 style="margin:0 0 6px 0;font-size:16px">Entrar</h2>
    <p class="muted" style="margin-top:0">
      Teste: Mestre (<b>mestre</b>/<b>1234</b>) • Player (<b>player1</b>/<b>1234</b>).
    </p>
    <div class="card" style="padding:14px;background:rgba(6,8,14,.65)">
      <div class="row">
        <div style="flex:1;min-width:220px">
          <label>Usuário</label>
          <input id="loginUser" placeholder="ex: mestre ou player1" autocomplete="username"/>
        </div>
        <div style="flex:1;min-width:220px">
          <label>Senha</label>
          <input id="loginPass" placeholder="ex: 1234" type="password" autocomplete="current-password"/>
        </div>
        <div style="min-width:160px;align-self:end">
          <button id="btnLogin" style="width:100%">Entrar</button>
        </div>
      </div>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <span class="muted mini" id="loginMsg"></span>
        <span class="pill">Salvo no navegador</span>
      </div>
    </div>
  </section>

  <!-- APP -->
  <section class="hidden" id="appRoot">
    <div class="grid">
      <section class="card" id="mainPanel"></section>
      <aside class="card" id="sidePanel"></aside>
    </div>
  </section>
</main>

<script>
/* =========================
   DB
========================= */
const KEY = "myr_hub_v1";
const UI = { activeTab: "tabRaces" };

const ATTR_KEYS = ["Forca","Destreza","Inteligencia","Vontade","Carisma"];
const ATTR_LABEL = {
  Forca: "FORÇA",
  Destreza: "DESTREZA",
  Inteligencia: "INTELIGÊNCIA",
  Vontade: "VONTADE (MAGIA)",
  Carisma: "CARISMA",
};
const SKILL_KEYS = ["Combate","Precisao","Resistencia","Investigacao","Persuasao","Arcanismo","Rituais","Oficios"];
const SKILL_LABEL = {
  Combate:"Combate",
  Precisao:"Precisão",
  Resistencia:"Resistência",
  Investigacao:"Investigação",
  Persuasao:"Persuasão",
  Arcanismo:"Arcanismo",
  Rituais:"Rituais",
  Oficios:"Ofícios",
};

const ATTR_ROT = ["Forca","Destreza","Inteligencia","Vontade","Carisma"];
  const SKILL_ROT = ["Combate","Precisao","Resistencia","Investigacao","Persuasao","Arcanismo","Rituais","Oficios"];


const $ = (id)=>document.getElementById(id);

function mkAttrsZero(){ const o={}; for(const k of ATTR_KEYS) o[k]=0; return o; }
function mkSkillsZero(){ const o={}; for(const k of SKILL_KEYS) o[k]=0; return o; }

function escapeHTML(str){
  return String(str||"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function nowStr(ts){ return new Date(ts).toLocaleString(); }
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

function slugify(s){
  return String(s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");
}
function uniqId(base, used){
  let id = base, i = 2;
  while(used.has(id)){ id = `${base}_${i++}`; }
  used.add(id);
  return id;
}

function setActiveTab(tabId){
  UI.activeTab = tabId || UI.activeTab || "tabRaces";
  document.querySelectorAll(".tabBtn").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===UI.activeTab);
  });
  document.querySelectorAll(".tabPanel").forEach(p=>{
    p.classList.toggle("hidden", p.id!==UI.activeTab);
  });
}

function defaultDB(){
  // ✅ Raças (135) e Classes (130) compactadas em string pra não travar arquivo
  const RACES_RAW = `
Humanos|Humanos do Norte|Humanos do Deserto|Humanos do Mar|Elfos Altos|Elfos da Lua|Elfos do Sol|Elfos Sombrios|Elfos Antigos|Anões da Montanha|Anões da Forja|Anões Profundos|Anões Rúnicos|Halflings Errantes|Halflings do Campo|Gnomos Arcanos|Gnomos Mecânicos|Meio-Elfos|Meio-Orcs|Meio-Gigantes|Meio-Demônios|Meio-Celestiais|Meio-Dragões|Meio-Feras|Meio-Elementais|Meio-Vampiros|Meio-Fadas|Meio-Espíritos
|Draconianos|Draconianos Antigos|Kobolds|Kobolds Alquímicos|Naga|Naga Reais|Lagartídeos|Serpentinos|Basilídeos|Filhos do Dragão
|Feralinos (lobo)|Feralinos (felino)|Feralinos (urso)|Feralinos (corvo)|Feralinos (réptil)|Minotauros|Centauros|Sátiros|Homens-Javali|Homens-Cabra
|Ifrits|Ondinos|Silfídeos|Terranos|Magmáticos|Glaciais|Tempestários|Cinéreos|Cristalinos|Elementais Encarnados
|Tieflings|Tieflings Abissais|Vampíricos|Vampiros Puros|Licantropos|Malditos da Lua|Filhos da Sombra|Abissais|Portadores da Ruína
|Aasimar|Aasimar Caídos|Nephilim|Filhos da Luz|Arautos Celestes|Iluminados|Juramentados|Portadores do Verbo|Solares|Luminares
|Espectrais|Revenantes|Ecos|Mortos-Vivos Conscientes|Ossíferos|Lamentadores|Ceifados|Guardiões do Túmulo|Mortais Retornados
|Autômatos Antigos|Construtos Vivos|Homúnculos Evoluídos|Simbiontes|Parasitados|Metamorfos|Mímicos Humanoides|Alterados|Cronomarcados|Portadores de Runas
|Dryades|Filhos da Árvore|Guardiões do Bosque|Silvestres Antigos|Espíritos da Terra|Espíritos Animais|Verdantes|Raiz-Viva|Musgos Conscientes|Entes Menores
|Fungóides|Insetoides|Aracnídeos|Aviários|Homens-Peixe|Tritões|Abissomarinhos|Crostáceos|Seres de Coral|Leviatânicos
|Titânicos|Sangue de Gigante|Colossos Menores|Filhos dos Reis Antigos|Herdeiros da Primeira Era|Portadores do Trono|Descendentes do Deus-Morto|Linhagem Proibida|Sangue Esquecido|Últimos de Sua Raça
|Avatares Mortais|Guardiões do Fim|Criados do Nada|Observadores|Vozes Encarnadas|Portadores do Silêncio|Herdeiros do Abismo|Arquitetos da Realidade|Os Inomináveis
`.replace(/\n/g,"").trim();

  const CLASSES_RAW = `
Guerreiro|Bárbaro|Cavaleiro|Gladiador|Mercenário|Sentinela|Duelista|Campeão|General de Guerra|Executor
|Arqueiro|Atirador|Batedor|Caçador|Caçador de Monstros|Ladino|Assassino|Infiltrador|Acrobata de Combate|Sombra
|Paladino|Templário|Guardião|Protetor do Juramento|Defensor|Escudeiro Sagrado|Bastião|Porta-Estandarte|Curandeiro de Guerra|Mártir
|Mago|Arquimago|Feiticeiro|Bruxo|Invocador|Ilusionista|Evocador|Abjurador|Conjurador|Arcanista
|Necromante|Ocultista|Sombramante|Hexblade|Profanador|Portador da Ruína|Ceifador|Arauto do Abismo|Cultista|Vinculado
|Clérigo|Sacerdote|Arauto Divino|Exorcista|Inquisidor|Oráculo|Profeta|Iluminado|Portador do Verbo|Juiz Sagrado
|Druida|Xamã|Guardião do Bosque|Chamador de Feras|Totêmico|Andarilho Selvagem|Vinculado à Terra|Espiritualista Natural|Mestre das Bestas|Druida da Praga
|Elementalista|Piroconjurador|Criomante|Aeromante|Geomante|Hidromante|Tempestário|Cinereomante|Magmaforjado|Avatar Elemental
|Cronomante|Distorcedor|Telepata|Psicomante|Oráculo do Tempo|Quebrador de Realidade|Viajante Dimensional|Anomalia Viva|Arquiteto do Possível|Eco Temporal
|Alquimista|Engenheiro de Guerra|Artífice|Runomante|Tecelão de Encantos|Sabotador|Estrategista|Tático de Campo|Mestre de Armadilhas|Arquiteto Bélico
|Portador do Caos|Amaldiçoado|Sangrador|Heraldo da Dor|Flagelante|Portador da Loucura|Arauto da Queda|Destruidor|Viciado em Poder|Condutor da Ruína
|Rei de Batalha|Herdeiro do Trono|Senhor da Guerra|Mestre das Ordens|Arauto do Fim|Guardião do Véu|Quebrador do Véu|Portador da Coroa|Lenda Viva|Escolhido
|Fragmento|Eco Vivo|Sobrevivente do Fim|Reescritor|Quebra-Regras|Portador do Talvez|Erro do Mundo|Constante|Variável|Anomalia Perfeita
`.replace(/\n/g,"").trim();

  const raceNames = RACES_RAW.split("|").map(s=>s.trim()).filter(Boolean);
  const classNames = CLASSES_RAW.split("|").map(s=>s.trim()).filter(Boolean);

  const usedRaceIds = new Set();
  const races = raceNames.map((name, idx)=>{
    const id = uniqId("race_" + slugify(name), usedRaceIds);
    const attrKey = ATTR_ROT[idx % ATTR_ROT.length];
    const skillKey = SKILL_ROT[idx % SKILL_ROT.length];
    const perkA = `Afinidade: ${ATTR_LABEL[attrKey]}`;
    const perkB = `Talento: ${SKILL_LABEL[skillKey]} +4`;
    const perkC = `Marca: um detalhe físico/energia que denuncia a linhagem`;
    return {
      id, tier:"padrao", name,
      lore:"Uma linhagem conhecida em MYR. Você decide a cultura, aparência e história.",
      buffs:{ attr:{ [attrKey]: +1 }, skill:{ [skillKey]: +4 } },
      perks:[perkA, perkB, perkC],
      note:"Dica: crie um tabu, um juramento ou uma tradição dessa raça."
    };
  });

  const usedClassIds = new Set();
  
  const classes = classNames.map((name, idx)=>{
    const id = uniqId("cls_" + slugify(name), usedClassIds);
    const attrKey = ATTR_ROT[idx % ATTR_ROT.length];
    const skillKey = SKILL_ROT[idx % SKILL_ROT.length];
    return {
      id, name,
      lore:"Disciplina do mundo MYR — adaptável ao seu estilo.",
      buffs:{ attr:{ [attrKey]: +1 }, skill:{ [skillKey]: +4 } }
    };
  });

  const DEFAULT_RACE_ID = races[0]?.id || "race_humanos";
  const DEFAULT_CLASS_ID = classes[0]?.id || "cls_guerreiro";

  const disadvantages = [
    { id:"dv_fobia", name:"Fobia", points:{attr:+1, skillPicks:+1}, desc:"Você escolhe um medo forte. Pode atrapalhar em cenas tensas." },
    { id:"dv_impulsivo", name:"Impulsivo", points:{attr:+1, skillPicks:+1}, desc:"Provocações te puxam. Decisões precipitadas (roleplay)." },
    { id:"dv_marcado", name:"Marcado", points:{attr:+2, skillPicks:+1}, desc:"Seu ‘sinal’ é mais visível — coisas te notam com facilidade." },
    { id:"dv_debito", name:"Dívida", points:{attr:+1, skillPicks:+2}, desc:"Um favor perigoso vai ser cobrado (o Mestre decide quando)." },
    { id:"dv_vozes", name:"Vozes", points:{attr:+2, skillPicks:+2}, desc:"Visões/lapsos em momentos de pressão (narrativo)." },
  ];

  return {
    users: [
      { id:"u_master", username:"mestre", password:"1234", role:"master" },
      { id:"u_p1", username:"player1", password:"1234", role:"player", playerId:"p1" },
    ],
    players: [
      {
        id:"p1",
        username:"player1",
        xp: 0,
        inventory: [],
        characterCreated: false,
        character: {
          avatarDataUrl: "",
          charName: "Player 1",
          preferredRaceId: DEFAULT_RACE_ID,
          classId: DEFAULT_CLASS_ID,
          finalRaceId: "",
          attrs: mkAttrsZero(),
          skills: mkSkillsZero(),
          disadvantages: [],
          pools: { attrBase: 10, skillPicksBase: 8 },
          levelSeen: 1,
          levelAttrBonus: 0,
          levelSkillBonus: 0,
          abilities: [],
          currentStats: { vida: 0, defesa: 0, velocidade: 0, mana: 0 }
        },
        log: [{ts: Date.now(), text:"Conta criada. Primeiro login libera criação."}]
      }
    ],
    races,
    classes,
    disadvantages,
    session: { userId:null }
  };
}

function loadDB(){
  const raw = localStorage.getItem(KEY);
  if(!raw){
    const db = defaultDB();
    localStorage.setItem(KEY, JSON.stringify(db));
    return db;
  }
  try { return JSON.parse(raw); }
  catch {
    const db = defaultDB();
    localStorage.setItem(KEY, JSON.stringify(db));
    return db;
  }
}
function saveDB(db){ localStorage.setItem(KEY, JSON.stringify(db)); }

let DB = loadDB();

/* ===== MIGRAÇÃO ===== */
(function migrateDB(){
  const base = defaultDB();
  let changed = false;

  if(!DB || typeof DB !== "object"){ DB = base; changed = true; }
  if(!Array.isArray(DB.users) || DB.users.length===0){ DB.users = base.users; changed = true; }
  if(!Array.isArray(DB.players) || DB.players.length===0){ DB.players = base.players; changed = true; }
  if(!Array.isArray(DB.races) || DB.races.length===0){ DB.races = base.races; changed = true; }
  if(!Array.isArray(DB.classes) || DB.classes.length===0){ DB.classes = base.classes; changed = true; }
  if(!Array.isArray(DB.disadvantages) || DB.disadvantages.length===0){ DB.disadvantages = base.disadvantages; changed = true; }
  if(!DB.session || typeof DB.session !== "object"){ DB.session = { userId:null }; changed = true; }

  for(const p of DB.players){
    if(!p.character || typeof p.character !== "object"){ p.character = {}; changed = true; }
    const c = p.character;

    if(typeof c.bonusesApplied !== "boolean"){ c.bonusesApplied = false; changed = true; }
    if(!c.attrs || typeof c.attrs !== "object"){ c.attrs = mkAttrsZero(); changed = true; }
    if(!c.skills || typeof c.skills !== "object"){ c.skills = mkSkillsZero(); changed = true; }
    if(!Array.isArray(c.disadvantages)){ c.disadvantages = []; changed = true; }
    if(!c.pools || typeof c.pools !== "object"){ c.pools = { attrBase:10, skillPicksBase:8 }; changed = true; }
    if(typeof c.levelSeen !== "number"){ c.levelSeen = 1; changed = true; }
    if(typeof c.levelAttrBonus !== "number"){ c.levelAttrBonus = 0; changed = true; }
    if(typeof c.levelSkillBonus !== "number"){ c.levelSkillBonus = 0; changed = true; }
    if(!Array.isArray(c.abilities)){ c.abilities = []; changed = true; }
    if(!c.currentStats || typeof c.currentStats !== "object"){
      c.currentStats = { vida:0, defesa:0, velocidade:0, mana:0 }; changed = true;
    }

    if(!c.preferredRaceId){ c.preferredRaceId = base.players[0].character.preferredRaceId; changed = true; }
    if(!c.classId){ c.classId = base.players[0].character.classId; changed = true; }
    if(typeof c.charName !== "string"){ c.charName = p.username || "Player"; changed = true; }
    if(typeof c.finalRaceId !== "string"){ c.finalRaceId = ""; changed = true; }

    if(!Array.isArray(p.inventory)){ p.inventory = []; changed = true; }
    if(!Array.isArray(p.log)){ p.log = []; changed = true; }
    if(typeof p.characterCreated !== "boolean"){ p.characterCreated = false; changed = true; }
    if(!Number.isFinite(Number(p.xp))) { p.xp = 0; changed = true; }
  }

  for(const u of DB.users){
    if(u && u.role==="player" && !u.playerId){
      const p = DB.players.find(pp=>pp.username===u.username);
      if(p){ u.playerId = p.id; changed = true; }
    }
  }

  if(changed) saveDB(DB);
})();

/* =========================
   Pools / Points
========================= */
function disadvBonus(player){
  let attr=0, skillPicks=0;
  for(const id of (player.character.disadvantages||[])){
    const d = getDisadv(id);
    if(d){ attr += (d.points?.attr||0); skillPicks += (d.points?.skillPicks||0); }
  }
  return {attr, skillPicks};
}
function totalAttrPoints(player){
  const base = player.character.pools?.attrBase ?? 10;
  return base + disadvBonus(player).attr + Number(player.character.levelAttrBonus||0);
}
function totalSkillPicks(player){
  const base = player.character.pools?.skillPicksBase ?? 8;
  return base + disadvBonus(player).skillPicks + Number(player.character.levelSkillBonus||0);
}
function spentAttrPoints(player){
  let sum=0;
  for(const k of ATTR_KEYS) sum += Number(player.character.attrs?.[k]||0);
  return sum;
}
function spentSkillPicks(player){
  let picks=0;
  for(const k of SKILL_KEYS) picks += Math.floor(Number(player.character.skills?.[k]||0)/4);
  return picks;
}

/* =========================
   XP / Level (100 XP por level)
========================= */
function levelFromXp(xp){
  const v = Math.max(0, Number(xp||0));
  return Math.floor(v/100) + 1;
}
function ensureLevelState(player){
  const c = player.character;
  if(typeof c.levelSeen !== "number") c.levelSeen = 1;
  if(typeof c.levelAttrBonus !== "number") c.levelAttrBonus = 0;
  if(typeof c.levelSkillBonus !== "number") c.levelSkillBonus = 0;
  if(!Array.isArray(c.abilities)) c.abilities = [];
  if(!c.currentStats || typeof c.currentStats !== "object") c.currentStats = { vida:0, defesa:0, velocidade:0, mana:0 };
}
function applyXpDelta(player, delta, reason){
  const d = Number(delta);
  if(!Number.isFinite(d)) return;
  player.xp = Math.max(0, Number(player.xp||0) + d);

  ensureLevelState(player);
  const newLevel = levelFromXp(player.xp);
  const oldLevel = Math.max(1, Number(player.character.levelSeen||1));

  if(newLevel > oldLevel){
    let skillGain = 0;
    for(let l = oldLevel + 1; l <= newLevel; l++){
      if(l % 5 === 0) skillGain++;
    }
    const diff = newLevel - oldLevel;
    // Atributos por level: +3 sempre. A cada 5 níveis, +2 extra (fica +5 naquele level).
    let attrExtra = 0;
    for(let l = oldLevel + 1; l <= newLevel; l++){
      if(l % 5 === 0) attrExtra += 2;
    }
    player.character.levelAttrBonus = Number(player.character.levelAttrBonus||0) + diff*2 + attrExtra;
    if(skillGain>0){
      player.character.levelSkillBonus = Number(player.character.levelSkillBonus||0) + skillGain;
      player.log.unshift({ts:Date.now(), text:`+${skillGain} pick(s) de Perícia (níveis múltiplos de 5).`});
    }
    player.log.unshift({ts:Date.now(), text:`Up! Level ${oldLevel} → ${newLevel} (+${diff*2} pontos de Atributo)`});
  }
  player.character.levelSeen = newLevel;

  if(reason){
    player.log.unshift({ts:Date.now(), text:`XP ${d>=0?"+":""}${d} — ${reason}`});
  }
  saveDB(DB);
}

/* =========================
   Bonuses apply
========================= */
function applyBonusesToSheet(player, race, cls){
  const a = player.character.attrs;
  const s = player.character.skills;

  const addAttr = (k,n)=>{ a[k] = Number(a[k]||0) + (n||0); };
  const addSkill = (k,n)=>{ s[k] = Number(s[k]||0) + (n||0); };

  const rb = race?.buffs || {};
  const cb = cls?.buffs || {};

  for(const [k,v] of Object.entries(rb.attr||{})) addAttr(k, v);
  for(const [k,v] of Object.entries(cb.attr||{})) addAttr(k, v);

  for(const [k,v] of Object.entries(rb.skill||{})) addSkill(k, v);
  for(const [k,v] of Object.entries(cb.skill||{})) addSkill(k, v);
}

/* =========================
   Derived resources
========================= */
function calcDerived(player){
  const a = player.character.attrs;

  const STR = Number(a.Forca||0);
  const DEX = Number(a.Destreza||0);
  const INT = Number(a.Inteligencia||0);
  const WIL = Number(a.Vontade||0);
  const CHA = Number(a.Carisma||0);

  // Barras base (simples e fáceis de balancear depois)
  const vida = 60 + STR*12 + WIL*6;
  const defesa = 10 + DEX*3 + WIL*2 + Math.floor(STR*0.5);
  const velocidade = 10 + DEX*3 + Math.floor(STR*0.7);
  const mana = 25 + INT*7 + WIL*9 + Math.floor(CHA*2);

  // Para a barra (%) ficar bonita no dashboard
  const maxVida = 260;
  const maxDef = 80;
  const maxVel = 80;
  const maxMana = 260;

  return {
    vida, defesa, velocidade, mana,
    pctVida: clamp(Math.round(vida/maxVida*100), 0, 100),
    pctDef: clamp(Math.round(defesa/maxDef*100), 0, 100),
    pctVel: clamp(Math.round(velocidade/maxVel*100), 0, 100),
    pctMana: clamp(Math.round(mana/maxMana*100), 0, 100),
  };
}

/* =========================
   Dashboard Stat Buttons (direct bind)
========================= */
function bindDashboardStatButtons(){
  if(window.__statBtnsBound) return;
  window.__statBtnsBound = true;

  document.addEventListener("click", (ev)=>{
    const btn = ev.target.closest('button[data-stat][data-step]');
    if(!btn) return;

    const kpiBox = btn.closest(".kpiBox");
    if(!kpiBox) return;

    ev.preventDefault();
    ev.stopPropagation();

    DB = loadDB();

    const user = findUserBySession();
    let pid = user?.playerId;
    if(!pid && user?.username){
      const byName = DB.players.find(pp=>pp.username===user.username);
      if(byName) pid = byName.id;
    }
    const p = pid ? getPlayer(pid) : null;
    if(!p) return;

    const stat = btn.dataset.stat;
    const step = Number(btn.dataset.step || 1);

    const label = (btn.textContent||"").trim();
    const dir = label.startsWith("-") ? -1 : 1;

    if(!p.character) p.character = {};
    if(!p.character.currentStats || typeof p.character.currentStats !== "object") p.character.currentStats = {};

    const derived = calcDerived(p);
    const base = (stat in p.character.currentStats)
      ? Number(p.character.currentStats[stat]||0)
      : Number(derived[stat]||0);

    const next = Math.max(0, base + dir*step);
    p.character.currentStats[stat] = next;

    saveDB(DB);
    render();
  }, true);
}

========================= */
function masterCreatePlayerLogin(displayName, username, password){
  if(DB.users.some(u=>u.username===username)) return {ok:false, msg:"Esse usuário já existe."};

  const base = defaultDB();
  const playerId = "p" + Math.random().toString(16).slice(2,8);
  const userId = "u_" + Math.random().toString(16).slice(2,8);

  DB.players.push({
    id: playerId,
    username,
    xp: 0,
    inventory: [],
    characterCreated: false,
    character: {
      avatarDataUrl: "",
      charName: displayName,
      preferredRaceId: base.players[0].character.preferredRaceId,
      classId: base.players[0].character.classId,
      finalRaceId: "",
      attrs: mkAttrsZero(),
      skills: mkSkillsZero(),
      disadvantages: [],
      pools: { attrBase: 10, skillPicksBase: 8 },
      levelSeen: 1,
      levelAttrBonus: 0,
      levelSkillBonus: 0,
      abilities: [],
      currentStats: { vida: 0, defesa: 0, velocidade: 0, mana: 0 }
    },
    log: [{ts:Date.now(), text:"Conta criada pelo Mestre. Primeiro login libera criação."}]
  });

  DB.users.push({ id:userId, username, password, role:"player", playerId });

  saveDB(DB);
  return {ok:true, msg:"Player criado! Login pronto."};
}
function masterResetCharacter(playerId){
  const p = getPlayer(playerId);
  if(!p) return;
  const base = defaultDB();
  p.characterCreated = false;
  p.character.finalRaceId = "";
  p.character.attrs = mkAttrsZero();
  p.character.skills = mkSkillsZero();
  p.character.disadvantages = [];
  p.character.preferredRaceId = base.players[0].character.preferredRaceId;
  p.character.classId = base.players[0].character.classId;
  p.log.unshift({ts:Date.now(), text:"Mestre resetou o personagem (recriação liberada)."});
  saveDB(DB);
}
function masterDeletePlayer(playerId){
  const p = getPlayer(playerId);
  if(!p) return;
  DB.users = DB.users.filter(u=>u.playerId!==playerId);
  DB.players = DB.players.filter(pp=>pp.id!==playerId);
  saveDB(DB);
}
function masterGiveItem(playerId, itemName){
  const p = getPlayer(playerId);
  if(!p) return;
  const name = String(itemName||"").trim();
  if(!name) return;
  p.inventory.unshift({ id:"it_"+Math.random().toString(16).slice(2,8), name, ts:Date.now() });
  p.log.unshift({ts:Date.now(), text:`Item recebido: ${name}`});
  saveDB(DB);
}
function masterGiveXP(playerId, amount, reason){
  const p = getPlayer(playerId);
  if(!p) return;
  const a = Number(amount);
  if(!Number.isFinite(a)) return;
  applyXpDelta(p, a, reason||"Mestre");
}

    ? `Sessão: ${user.role==="master" ? "Mestre" : "Player"} (${user.username})`

  if(!user) return;

  if(user.role==="master") renderMaster();
  else {
    let pid = user.playerId || (DB.players.find(p=>p.username===user.username)?.id);
    if(!pid && DB.players.length===1) pid = DB.players[0].id;
    if(pid && user.playerId!==pid){ user.playerId = pid; saveDB(DB); }

function updateKpiBars(){
  const map = [
    ["vida","Vida"],["defesa","Defesa"],["velocidade","Velocidade"],["mana","Mana"]
  ];
  const toNum = (t)=> {
    const s = String(t ?? "").replace(/[^0-9.-]+/g,"");
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  };
  for(const [key,label] of map){
    const fill = document.getElementById(key+"Fill");
    const refEl = document.getElementById(key+"Ref");
    const valEl = document.getElementById(key+"Val");
    if(!fill || !refEl || !valEl) continue;

    const cur = toNum(valEl.textContent);
    const ref = toNum(refEl.textContent);

    const pct = ref>0 ? Math.max(0, Math.min(100, (cur/ref)*100)) : 0;
    fill.style.width = pct.toFixed(2)+"%";
    fill.parentElement.title = cur+" / "+ref;
  }
}

function renderKpi(title, id, value, max){
  const safeMax = Number.isFinite(Number(max)) ? Number(max) : 0;
  const safeVal = Number.isFinite(Number(value)) ? Number(value) : 0;
  const pct = safeMax>0 ? clamp(Math.round((safeVal/safeMax)*100), 0, 100) : 0;

  return `
    <div class="kpiBox">
      <div class="kpiTitle">
        <b>${title}</b>
        <span class="pill mini">Ref.: ${safeMax}</span>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <div class="kpiValue" id="${id}Val">${safeVal}</div>
        <div class="row" style="gap:6px">
          <button type="button" class="secondary mini" data-stat="${id}" data-step="5">-5</button>
          <button type="button" class="secondary mini" data-stat="${id}" data-step="1">-1</button>
          <button type="button" class="secondary mini" data-stat="${id}" data-step="1">+1</button>
          <button type="button" class="secondary mini" data-stat="${id}" data-step="5">+5</button>
        </div>
      </div>
      <div class="kpiBar" title="${safeVal} / ${safeMax}">
        <div id="${id}Fill" style="width:${pct}%"></div>
      </div>
    </div>
  `;
}

function formatBuffs(buffs){
  if(!buffs) return "";
  const parts = [];
  if(buffs.attr){
    for(const [k,v] of Object.entries(buffs.attr)){
      const lbl = ATTR_LABEL[k] || k;
      if(v) parts.push(`• ${lbl} ${v>0?"+":""}${v}`);
    }
  }
  if(buffs.skill){
    for(const [k,v] of Object.entries(buffs.skill)){
      const lbl = SKILL_LABEL[k] || k;
      if(v) parts.push(`• ${lbl} ${v>0?"+":""}${v}`);
    }
  }
  return parts.length ? parts.join("<br>") : "—";
}

                <span class="tag">+${d.points.attr} attr • +${d.points.skillPicks} picks</span>
              </div>
              <div class="muted mini" style="margin-top:6px">${escapeHTML(d.desc)}</div>
            </div>
            <div><input type="checkbox" data-dv="${d.id}" ${sel?"checked":""}></div>
          </label>
        `;
      }).join("")}
    </div>
  `;

  tab.querySelectorAll("input[type=checkbox][data-dv]").forEach(chk=>{
    chk.onchange = ()=>{
      const id = chk.dataset.dv;
      const p2 = getPlayer(playerId);
      const set = new Set(p2.character.disadvantages||[]);
      if(chk.checked) set.add(id); else set.delete(id);
      p2.character.disadvantages = Array.from(set);
      saveDB(DB); DB = loadDB();
      renderDisadvTab(playerId);
      renderCharacterCreator(getPlayer(playerId));
    };
  });
}

function finalizeCreation(playerId){
  const p = getPlayer(playerId);
  if(!p) return;

  if(spentAttrPoints(p) > totalAttrPoints(p)){ alert("Atributos acima do limite."); return; }
  if(spentSkillPicks(p) > totalSkillPicks(p)){ alert("Perícias acima do limite."); return; }

  const race = getRace(p.character.preferredRaceId) || DB.races?.[0];
  const cls  = getClass(p.character.classId) || DB.classes?.[0];
  if(!race || !cls){ alert("Escolha uma raça e uma classe."); return; }

  if(!p.character.bonusesApplied){
    applyBonusesToSheet(p, race, cls);
    p.character.bonusesApplied = true;
  }

  p.character.finalRaceId = race.id;
  p.characterCreated = true;

  const d0 = calcDerived(p);
  p.character.currentStats = { vida:d0.vida, defesa:d0.defesa, velocidade:d0.velocidade, mana:d0.mana };

  p.log.unshift({ts:Date.now(), text:`Personagem finalizado — Raça: ${race.name} | Classe: ${cls.name}`});
  saveDB(DB);
  render();
  toast("Personagem finalizado! ✅", true);
}



function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// Safety: prevent submit
document.addEventListener("submit", (e)=>{ e.preventDefault(); }, true);
document.addEventListener("click", (e)=>{
  const b = e.target.closest && e.target.closest("button");
  if(!b) return;
  if(!b.hasAttribute("type")) b.setAttribute("type","button");
  if(String(b.getAttribute("type")).toLowerCase()==="submit") b.setAttribute("type","button");
}, true);

/* Delegation */
document.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-action]");
  if(!btn) return;

  const action = btn.dataset.action;
  const user = findUserBySession();
  if(!user) return;

  let p = null;
  if(user.role === "player"){
    p = getPlayer(user.playerId);
  } else if(user.role === "master"){
    const sel = document.getElementById("m_selPlayer");
    const pid = (sel && sel.value) ? sel.value : (DB.players[0]?.id || null);
    if(pid) p = getPlayer(pid);
  }
  if(!p) return;
  ensureLevelState(p);

  if(action==="lvl_attr_inc"){
    if(!p.characterCreated) return;
    const key = btn.dataset.key;
    if(!key) return;
    if(Number(p.character.levelAttrBonus||0) <= 0) return;
    p.character.levelAttrBonus = Number(p.character.levelAttrBonus||0) - 1;
    p.character.attrs[key] = Number(p.character.attrs?.[key]||0) + 1;
    saveDB(DB);
    render();
    return;
  }

  if(action==="lvl_skill_inc"){
    if(!p.characterCreated) return;
    const key = btn.dataset.key;
    if(!key) return;
    if(Number(p.character.levelSkillBonus||0) <= 0) return;
    p.character.levelSkillBonus = Number(p.character.levelSkillBonus||0) - 1;
    p.character.skills[key] = Number(p.character.skills?.[key]||0) + 4;
    saveDB(DB);
    render();
    return;
  }

  if(action==="apply_xp"){
    const delta = Number($("xpDelta")?.value || 0);
    const reason = String($("xpReason")?.value || "").trim();
    applyXpDelta(p, delta, reason);
    toast("XP aplicado!", true);
    render();
    return;
  }
});


/* =========================
   Skill Tree (MYR)
   - salva por personagem em localStorage
   - nós arrastáveis + links de pré-requisito
========================= */
function ensureSkillTree(player){
  if(!player.character) player.character = {};
  if(!player.character.skillTree || typeof player.character.skillTree !== "object"){
    player.character.skillTree = { nodes: [], links: [] };
  }
  if(!Array.isArray(player.character.skillTree.nodes)) player.character.skillTree.nodes = [];
  if(!Array.isArray(player.character.skillTree.links)) player.character.skillTree.links = [];
  return player.character.skillTree;
}

function injectSkillTreeStyles(){
  if(document.getElementById("stStyles")) return;
  const st = document.createElement("style");
  st.id = "stStyles";
  st.textContent = `
    .stWrap{display:grid;grid-template-columns:1fr 320px;gap:12px}
    @media (max-width:900px){ .stWrap{grid-template-columns:1fr} }
    .stToolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .stBoard{
      position:relative; height:64vh; min-height:420px;
      border:1px solid var(--line); border-radius:18px; background:#0c131c; overflow:hidden;
    }
    .stSvg{position:absolute;inset:0;pointer-events:none}
    .stNode{
      position:absolute; min-width:170px; max-width:220px;
      border:1px solid var(--line); border-radius:16px; padding:10px;
      background:rgba(18,26,36,.96); backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      cursor:grab; user-select:none;
    }
    .stNode:active{cursor:grabbing}
    .stNode b{display:block;font-size:13px}
    .stNode .mini{font-size:12px;color:var(--muted);line-height:1.2}
    .stNode.sel{outline:2px solid rgba(43,108,255,.65); box-shadow: 0 0 0 6px rgba(43,108,255,.12);}
    .stPill{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:#0b121a;color:var(--muted);font-size:12px}
    .stSide .card{background:#0c131c}
    .stSide input,.stSide textarea,.stSide select{width:100%}
    .stSide textarea{min-height:90px;resize:vertical}
  `;
  document.head.appendChild(st);
}

function openSkillTreeModal(playerId){
  injectSkillTreeStyles();

  DB = loadDB();
  const p = getPlayer(playerId);
  if(!p) return;

  const tree = ensureSkillTree(p);

  // state local do modal
  const state = {
    mode: "move", // move | link
    selectedId: null,
    linkFrom: null,
  };

  const html = `
    <div class="overlay" id="ovSkillTree">
      <div class="modal">
        <div class="modalHeader">
          <div>
            <div style="font-size:16px;font-weight:950">🌿 Árvore de Skills — ${escapeHTML(p.character.charName||p.username)}</div>
            <div class="muted mini">Modo <b id="stModeLabel">MOVER</b> • arraste nós, crie pré-requisitos, edite sem poluir a ficha.</div>
          </div>
          <div class="row">
            <button class="secondary" id="stExport">Exportar JSON</button>
            <button class="secondary" id="stImport">Importar JSON</button>
            <button class="danger" id="stClose">Fechar</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="stToolbar">
          <button id="stAdd">+ Nova skill</button>
          <button class="secondary" id="stMode">Alternar: mover/link</button>
          <span class="pill">Nós: <b id="stCount">0</b> • Links: <b id="stLinkCount">0</b></span>
          <span class="muted mini" id="stHint"></span>
        </div>

        <div class="divider"></div>

        <div class="stWrap">
          <div class="stBoard" id="stBoard">
            <svg class="stSvg" id="stSvg"></svg>
            <div id="stNodes"></div>
          </div>

          <div class="stSide" id="stSide">
            <div class="card">
              <b>Editor</b>
              <div class="divider"></div>
              <div class="muted mini" id="stEmpty">Clique numa skill para editar.</div>

              <div id="stForm" class="hidden">
                <label class="mini">Nome</label>
                <input id="stName" placeholder="Ex: Corte do Véu">

                <div class="row" style="margin-top:10px">
                  <div style="flex:1;min-width:120px">
                    <label class="mini">Nível</label>
                    <input id="stLevel" type="number" min="1" value="1">
                  </div>
                  <div style="flex:1;min-width:120px">
                    <label class="mini">Mana</label>
                    <input id="stMana" type="number" min="0" value="5">
                  </div>
                </div>

                <div class="row" style="margin-top:10px">
                  <div style="flex:1;min-width:140px">
                    <label class="mini">Tipo</label>
                    <select id="stType">
                      <option value="ativa">Ativa</option>
                      <option value="passiva">Passiva</option>
                      <option value="reacao">Reação</option>
                    </select>
                  </div>
                  <div style="flex:1;min-width:140px">
                    <label class="mini">Status</label>
                    <select id="stState">
                      <option value="bloqueada">Bloqueada</option>
                      <option value="liberada">Liberada</option>
                      <option value="comprada">Comprada</option>
                    </select>
                  </div>
                </div>

                <div style="margin-top:10px">
                  <label class="mini">Descrição</label>
                  <textarea id="stDesc" placeholder="Efeito curto e claro..."></textarea>
                </div>

                <div class="row" style="margin-top:10px">
                  <button class="secondary" id="stDel">Remover</button>
                  <button id="stSave">Salvar</button>
                </div>

                <div class="divider"></div>
                <div class="muted mini">
                  Dica: no futuro dá pra travar skills por <b>Raça</b> e <b>Classe</b> automaticamente.
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", html);

  const close = ()=>{
    document.getElementById("ovSkillTree")?.remove();
    // salva DB quando fechar
    saveDB(DB);
  };

  document.getElementById("stClose").onclick = close;
  document.getElementById("ovSkillTree").addEventListener("click",(e)=>{ if(e.target.id==="ovSkillTree") close(); });

  const board = document.getElementById("stBoard");
  const svg = document.getElementById("stSvg");
  const nodesWrap = document.getElementById("stNodes");

  function persist(){
    // re-carrega p e salva na DB atual para não perder por referência
    const p2 = getPlayer(playerId);
    if(!p2) return;
    ensureSkillTree(p2).nodes = tree.nodes;
    ensureSkillTree(p2).links = tree.links;
    saveDB(DB);
  }

  function updateCounters(){
    document.getElementById("stCount").textContent = String(tree.nodes.length);
    document.getElementById("stLinkCount").textContent = String(tree.links.length);
  }

  function setMode(next){
    state.mode = next;
    document.getElementById("stModeLabel").textContent = next==="move" ? "MOVER" : "LINK";
    document.getElementById("stHint").textContent =
      next==="move"
        ? "Arraste as skills para organizar."
        : "Clique na skill A e depois na skill B para criar pré-requisito.";
    state.linkFrom = null;
  }

  function nodeCenter(n){
    // tenta ler o tamanho real do node renderizado
    const el = nodesWrap.querySelector(`[data-node="${n.id}"]`);
    const w = el ? el.offsetWidth : 180;
    const h = el ? el.offsetHeight : 90;
    return { x: n.x + w/2, y: n.y + h/2 };
  }

  function drawLinks(){
    const bb = board.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${bb.width} ${bb.height}`);
    svg.setAttribute("width", bb.width);
    svg.setAttribute("height", bb.height);

    const lines = [];
    for(const lk of tree.links){
      const a = tree.nodes.find(x=>x.id===lk.from);
      const b = tree.nodes.find(x=>x.id===lk.to);
      if(!a || !b) continue;
      const p1 = nodeCenter(a);
      const p2 = nodeCenter(b);
      lines.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="rgba(43,108,255,.75)" stroke-width="3" />`);
      lines.push(`<circle cx="${p2.x}" cy="${p2.y}" r="5" fill="rgba(43,108,255,.85)"/>`);
    }
    svg.innerHTML = lines.join("");
  }

  function renderNodes(){
    nodesWrap.innerHTML = tree.nodes.map(n=>{
      const sel = n.id===state.selectedId ? "sel" : "";
      const mana = Number(n.mana||0);
      const lvl = Number(n.level||1);
      const t = escapeHTML(n.type||"ativa");
      const st = escapeHTML(n.state||"bloqueada");
      return `
        <div class="stNode ${sel}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px">
          <b>${escapeHTML(n.name||"Nova Skill")}</b>
          <div class="mini">${escapeHTML(n.desc||"")}</div>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
            <span class="stPill">Lvl ${lvl}</span>
            <span class="stPill">${mana} Mana</span>
            <span class="stPill">${t}</span>
            <span class="stPill">${st}</span>
          </div>
        </div>
      `;
    }).join("");
    updateCounters();
    drawLinks();
  }

  function openEditor(n){
    state.selectedId = n?.id || null;

    const empty = document.getElementById("stEmpty");
    const form = document.getElementById("stForm");
    if(!n){
      empty.classList.remove("hidden");
      form.classList.add("hidden");
      renderNodes();
      return;
    }

    empty.classList.add("hidden");
    form.classList.remove("hidden");

    document.getElementById("stName").value = n.name||"";
    document.getElementById("stLevel").value = n.level||1;
    document.getElementById("stMana").value = n.mana||0;
    document.getElementById("stType").value = n.type||"ativa";
    document.getElementById("stState").value = n.state||"bloqueada";
    document.getElementById("stDesc").value = n.desc||"";

    renderNodes();
  }

  // add
  document.getElementById("stAdd").onclick = ()=>{
    const bb = board.getBoundingClientRect();
    const node = {
      id: "sk_" + Math.random().toString(16).slice(2,8),
      x: Math.max(12, Math.round(bb.width*0.12)),
      y: Math.max(12, Math.round(bb.height*0.12)),
      name: "Nova Skill",
      desc: "Descreva o efeito...",
      level: 1,
      mana: 5,
      type: "ativa",
      state: "bloqueada",
    };
    tree.nodes.push(node);
    persist();
    openEditor(node);
  };

  // mode toggle
  document.getElementById("stMode").onclick = ()=>{
    setMode(state.mode==="move" ? "link" : "move");
  };

  // export / import
  document.getElementById("stExport").onclick = ()=>{
    const json = JSON.stringify(tree, null, 2);
    navigator.clipboard?.writeText(json).then(()=>{
      toast("JSON copiado! (Ctrl+V onde quiser)", true);
    }).catch(()=>{
      prompt("Copie o JSON:", json);
    });
  };
  document.getElementById("stImport").onclick = ()=>{
    const raw = prompt("Cole o JSON da árvore aqui:");
    if(!raw) return;
    try{
      const obj = JSON.parse(raw);
      if(!obj || typeof obj!=="object") throw new Error("json inválido");
      if(!Array.isArray(obj.nodes) || !Array.isArray(obj.links)) throw new Error("faltando nodes/links");
      tree.nodes = obj.nodes;
      tree.links = obj.links;
      persist();
      openEditor(null);
      renderNodes();
      toast("Árvore importada!", true);
    }catch(err){
      toast("JSON inválido. Não importei.", false);
    }
  };

  // editor buttons
  document.getElementById("stSave").onclick = ()=>{
    const n = tree.nodes.find(x=>x.id===state.selectedId);
    if(!n) return;

    n.name = String(document.getElementById("stName").value||"").trim() || "Skill";
    n.level = Math.max(1, Number(document.getElementById("stLevel").value||1));
    n.mana = Math.max(0, Number(document.getElementById("stMana").value||0));
    n.type = document.getElementById("stType").value;
    n.state = document.getElementById("stState").value;
    n.desc = String(document.getElementById("stDesc").value||"").trim();

    persist();
    renderNodes();
    toast("Skill salva.", true);
  };

  document.getElementById("stDel").onclick = ()=>{
    const id = state.selectedId;
    if(!id) return;
    if(!confirm("Remover essa skill? (vai remover links também)")) return;

    tree.nodes = tree.nodes.filter(x=>x.id!==id);
    tree.links = tree.links.filter(l=>l.from!==id && l.to!==id);
    state.selectedId = null;
    state.linkFrom = null;

    persist();
    openEditor(null);
    renderNodes();
    toast("Skill removida.", true);
  };

  // interaction: click nodes, drag, link
  let drag = null;

  function pickNodeEl(target){
    return target.closest && target.closest(".stNode");
  }

  nodesWrap.addEventListener("mousedown", (e)=>{
    const el = pickNodeEl(e.target);
    if(!el) return;

    const id = el.dataset.node;
    const n = tree.nodes.find(x=>x.id===id);
    if(!n) return;

    // select
    if(state.mode==="link"){
      if(!state.linkFrom){
        state.linkFrom = id;
        state.selectedId = id;
        renderNodes();
        toast("Escolha a skill de DESTINO.", true);
      }else{
        const from = state.linkFrom;
        const to = id;
        if(from===to){ state.linkFrom = null; toast("Cancelado.", false); return; }
        const exists = tree.links.some(l=>l.from===from && l.to===to);
        if(!exists) tree.links.push({from, to});
        state.linkFrom = null;
        persist();
        renderNodes();
        toast("Pré-requisito criado.", true);
      }
      openEditor(n);
      return;
    }

    // move mode -> start drag
    state.selectedId = id;
    openEditor(n);

    const rect = board.getBoundingClientRect();
    drag = {
      id,
      startX: e.clientX,
      startY: e.clientY,
      nodeX: n.x,
      nodeY: n.y,
      rectW: rect.width,
      rectH: rect.height,
    };
    e.preventDefault();
  });

  window.addEventListener("mousemove", (e)=>{
    if(!drag || state.mode!=="move") return;
    const n = tree.nodes.find(x=>x.id===drag.id);
    if(!n) return;

    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;

    n.x = clamp(drag.nodeX + dx, 8, drag.rectW - 240);
    n.y = clamp(drag.nodeY + dy, 8, drag.rectH - 120);

    renderNodes();
  });

  window.addEventListener("mouseup", ()=>{
    if(!drag) return;
    persist();
    drag = null;
  });

  // first render
  setMode("move");
  openEditor(null);
  renderNodes();
}


render();
